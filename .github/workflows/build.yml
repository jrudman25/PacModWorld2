name: Build download artifacts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neoforge-1_21_1:
    name: NeoForge 1.21.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x gradlew && ./gradlew build --no-daemon
      - run: ./gradlew runGameTestServer --no-daemon
      - name: Fail on mod errors in the GameTest log
        run: |
          log=runs/gameTestServer/logs/latest.log
          test -f "$log" || { echo "::error::$log not found"; exit 1; }
          if grep -E '/(ERROR|FATAL)\].*pacmodworld2' "$log"; then echo "::error::pacmodworld2 errors in GameTest server log (see lines above)"; exit 1; fi
      - uses: actions/upload-artifact@v5
        with:
          name: pacmodworld2-neoforge-1.21.1
          path: build/libs/pacmodworld2-neoforge-1.21.1-*.jar
          if-no-files-found: error
